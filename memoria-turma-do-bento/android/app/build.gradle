plugins {
    id 'com.android.application'
}

android {
    namespace 'com.turmadobento.memoria'
    compileSdk 35

    defaultConfig {
        applicationId 'com.turmadobento.memoria'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copia o jogo web (pasta acima de android/) para os assets do APK,
// assim existe uma única fonte para o jogo no navegador e no app.
def copiarJogo = tasks.register('copiarJogo', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'jogo.js', 'personagens.js', 'personagens/**', 'icons/**'
    }
    into layout.buildDirectory.dir('jogo-assets/www')
}

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('jogo-assets'))
tasks.named('preBuild') { dependsOn copiarJogo }
